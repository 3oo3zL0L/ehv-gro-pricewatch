name: Prijswacht EIN

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Stuur altijd een testmelding"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests draaien
        run: python -m unittest discover -s tests

      - name: Prijzen checken
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_NOTIFY: ${{ inputs.test_notification }}
        run: python price_watch.py

      - name: Historie en rapport opslaan
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.csv state.json REPORT.md
          if git diff --cached --quiet; then
            echo "Niets veranderd."
            exit 0
          fi
          git commit -m "prices: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push mislukt, poging $i"
            sleep 5
          done
          exit 1
