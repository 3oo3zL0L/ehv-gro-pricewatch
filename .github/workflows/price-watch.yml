name: Prijswacht EHV-GRO

on:
  schedule:
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Stuur altijd een testmelding"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prijzen checken
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_TOTAL: ${{ vars.TARGET_TOTAL }}
          FORCE_NOTIFY: ${{ inputs.test_notification }}
        run: python price_watch.py
      - name: Laatste prijzen opslaan
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Prijzen bijgewerkt"
          git push
